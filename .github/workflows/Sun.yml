name: Build FNF Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: '4.3.7'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK/NDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-29"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"
          sdkmanager "ndk;29.0.13113456"

      - name: Install Haxe libraries
        run: |
          haxelib setup ~/haxelib
          haxelib install lime
          haxelib install hmm
          haxelib run lime setup

      - name: Setup Lime Android
        run: |
          haxelib run lime setup android

      - name: Install project dependencies
        run: |
          haxelib run hmm install

      - name: Build Android
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/29.0.13113456
        run: |
          haxelib run lime build android -release

      - name: Find APK
        run: |
          find export -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FNF-VSlice-Android
          path: |
            export/**/*.apk
          if-no-files-found: error
